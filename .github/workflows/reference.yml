name: Reference

# The language reference (reference/, issue #49): build the book with mdBook, check its internal links
# and, on pushes to the default or the development branch, publish it on GitHub Pages. The Hugin
# examples of the book are compiled by `sbt test` (ReferenceExamplesSuite) in ci.yml.

on:
  push:
  pull_request:

concurrency:
  group: reference-${{ github.ref }}
  cancel-in-progress: true

env:
  # publish from these pushes only
  PUBLISH: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/ccr-48027e29-daam41') }}

jobs:
  build:
    name: Build and link-check the book
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook and lychee (pinned release binaries)
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4,lychee@0.24.2
      - name: Build the book (the error index is generated from docs/errors)
        run: mdbook build reference
      - name: Check internal links and anchors (offline)
        run: >-
          lychee --offline --no-progress --include-fragments
          --exclude-path reference/book/404.html
          'reference/book/**/*.html'
      - name: Upload the site for GitHub Pages
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: reference/book

  deploy:
    name: Publish on GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/ccr-48027e29-daam41')
    runs-on: ubuntu-latest
    # Pages must be enabled by the repository owner (Settings > Pages > Source: GitHub Actions); until
    # then this job fails without failing the workflow
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
