name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting (scalafmt)
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck js/scalafmtCheck
      - name: Check that sources cite the language reference, not REDESIGN.md sections
        run: scripts/check-refs.sh
      - name: Check the wording of the reference and the error explanations (reference/STYLE.md)
        run: scripts/check-style.sh

  reference-impact:
    name: Reference updated with the language
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A change to the language changes the reference (CONTRIBUTING.md, "Changing the language")
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-reference-impact.sh "origin/${{ github.base_ref }}"

  test:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    env:
      CI: "true"   # turns compiler warnings into errors (see build.sbt)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile (warnings are errors)
        run: sbt -batch compile Test/compile
      - name: Golden tests (tests/run, tests/neg, tests/pos)
        run: sbt -batch test
      - name: Stage the launcher (sbt-native-packager)
        run: sbt -batch stage
      - name: Smoke test the CLI on the examples
        run: scripts/smoke.sh
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: target/test-reports

  browser:
    name: Browser build (Scala.js)
    runs-on: ubuntu-latest
    env:
      CI: "true"   # turns compiler warnings into errors (see build.sbt)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # fails if a shared package uses a JVM-only package or API (CONTRIBUTING.md, "The browser build")
      - name: Link the bundle (fullLinkJS with the Closure Compiler)
        run: sbt -batch js/bundle
      - name: Run tests/run and tests/json through the bundle in Node; bundle size
        run: node scripts/js-golden.mjs js/target/bundle
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: hugin-js
          path: js/target/bundle
          if-no-files-found: error

  vscode:
    name: VS Code extension (.vsix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check that the grammar and the language configuration are valid JSON
        run: node -e "for (const f of ['syntaxes/hugin.tmLanguage.json', 'language-configuration.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
      - name: Package the extension (vsce)
        run: npx @vscode/vsce package --skip-license --out hugin.vsix
      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: hugin-vscode
          path: editors/vscode/hugin.vsix
          if-no-files-found: error
