name: Site

# The website (issue #58, docs/design/website.md): the landing page at /hugin/, the language reference
# (reference/, issue #49) at /hugin/reference/ with redirect pages from its old URLs, and the playground
# at /hugin/play/. The job builds the book with mdBook, builds the site into _site/ (site/build.mjs) and checks
# its internal links (the book's included), and, on pushes to the default or the development branch,
# publishes _site/ on GitHub Pages. The Hugin examples of the book and the landing page's examples are
# compiled by `sbt test` (ReferenceExamplesSuite, GoldenTests) in ci.yml; site/build.mjs checks their
# outputs again. The highlighting is computed by the compiler (reference/highlight.py and
# site/build.mjs run `hugin highlight`), so the compiler is staged first.

on:
  push:
  pull_request:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  # publish from these pushes only
  PUBLISH: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/ccr-48027e29-daam41') }}

jobs:
  build:
    name: Build and link-check the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # the playground's compiler is the Scala.js bundle of the `web` project (batch W4); until that project
      # exists the playground is built without it and says so
      - name: Stage the compiler (it highlights the code), and link it for the browser
        run: |
          if grep -qE '^lazy val web\b' build.sbt; then
            sbt -batch stage web/fullLinkJS
            bundle="$(find web -path '*-opt/main.js' -print -quit)"
            test -n "$bundle" || { echo "no linked bundle under web/"; exit 1; }
            echo "HUGIN_JS=$bundle" >> "$GITHUB_ENV"
          else
            sbt -batch stage
          fi
      - name: Install mdBook and lychee (pinned release binaries)
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4,lychee@0.24.2
      - name: Build the book (the error index is generated from docs/errors, the highlighting by the compiler)
        run: mdbook build reference
      - name: Build the site (landing page, playground, reference and redirects into _site/)
        run: |
          npm ci --prefix site --no-audit --no-fund
          node site/build.mjs
      - name: Check the site's internal links and anchors (offline)
        run: >-
          lychee --offline --no-progress --include-fragments
          --exclude-path _site/404.html --exclude-path _site/reference/404.html
          --exclude '/play/?#'
          '_site/**/*.html'
      - name: Upload the site for GitHub Pages
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/ccr-48027e29-daam41')
    runs-on: ubuntu-latest
    # Pages must be enabled by the repository owner (Settings > Pages > Source: GitHub Actions); until
    # then this job fails without failing the workflow
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
