name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting (scalafmt)
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck

  test:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    env:
      CI: "true"   # turns compiler warnings into errors (see build.sbt)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile (warnings are errors)
        run: sbt -batch compile Test/compile
      - name: Golden tests (tests/run, tests/neg, tests/pos)
        run: sbt -batch test
      - name: Stage the launcher (sbt-native-packager)
        run: sbt -batch stage
      - name: Smoke test the CLI on the examples
        run: scripts/smoke.sh
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: target/test-reports
